<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva - Cumbres de Ambar</title>
</head>
<body>
    <h1 >Haga su reserva</h1>
    <form action="procesareserva.php" method="get">
        <fieldset>
            <legend>Datos Personales</legend>
        <p>
        <label for="nom">Nombre:</label>
        <input type="text" id="nom" name="nombre" autofocus required maxlength="100">
        </p>
        <p>
        <label for="ape">Apellidos:</label>
        <input type="text" id="ape" name="apellidos" required maxlength="100">
        </p>
         <p>
        <label for="dni">DNI:</label>
        <input type="text" id="dni" name="dni" required maxlength="10" required placeholder="DNI con letra">
        </p>
        </fieldset> 
        <fieldset>
            <legend>Datos de su estancia</legend>
        <p>
        Habitación:
        <label for="individual">Individual</label>
        <input type="radio" id="individual" name="habitacion" value="individual">
        <label for="doble">Doble</label>
        <input type="radio" id="doble" name="habitacion" value="doble">
        <label for="triple">Triple</label>
        <input type="radio" id="triple" name="habitacion" value="triple">
        <p>
        <p>
        <label for="personas">Numero de personas:</label>
        <select id="personas" name="personas" required>
            <option value="">Seleccione una opción</option>
            <option value="1">1 persona</option>
            <option value="2">2 personas</option>
            <option value="3">3 personas</option>
        </select>
        </p>
        <p>
        <label for="mascota">Llevo mascotas</label>
        <input type="checkbox" id="mascota" name="mascota">
        </p>
        <p>
        <label for="date">Fecha de llegada:</label>
        <input type="date" id="date" name="date" required >
        </p>
        <label for="hora">Hora de llegada:</label>
        <input type="time" id="hora" name="hora" required >
        </p>
        </fieldset>
          
        <input type="submit" value="Enviar">
        <input type="reset" value="Reiniciar">
        <a href="index.html" target="_blank">Volver</a>
        
    </form>
    <!-- Formulario de reserva -->
</body>
</html>
